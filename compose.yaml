
services:
  postgres:
    image: postgres:18
    container_name: solar-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    # Database schema is applied explicitly by scripts/run_migrations.py.
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:18
    container_name: solar-postgres-test

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}

    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"

    # Test schema is also applied explicitly by scripts/run_migrations.py.
    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data: