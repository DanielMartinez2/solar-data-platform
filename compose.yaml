x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: solar-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  profiles:
    - airflow

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    DATABASE_URL: >-
      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./scripts:/opt/solar-data-platform/scripts:ro
    - ./database:/opt/solar-data-platform/database:ro

services:
  postgres:
    image: postgres:18
    container_name: solar-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    # Database schema is applied explicitly by scripts/run_migrations.py.
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:18
    container_name: solar-postgres-test

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}

    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"

    # Test schema is also applied explicitly by scripts/run_migrations.py.
    volumes:
      - postgres_test_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-postgres:
    image: postgres:17
    container_name: solar-airflow-postgres
    profiles:
      - airflow

    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: solar-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: solar-airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server

    ports:
      - "${AIRFLOW_API_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:8080/api/v2/monitor/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: solar-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-scheduler:
    <<: *airflow-common
    container_name: solar-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    command: scheduler

volumes:
  postgres_data:
  postgres_test_data:
  airflow_postgres_data:
