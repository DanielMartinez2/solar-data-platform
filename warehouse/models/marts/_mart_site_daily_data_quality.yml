version: 2

models:
  - name: mart_site_daily_data_quality
    description: >
      Indicadores diários de qualidade dos dados por instalação,
      distinguindo lacunas, medições inválidas e conflitos ainda
      não resolvidos por uma medição válida correspondente.

    columns:
      - name: site_id
        description: Identificador da instalação.
        data_tests:
          - not_null

      - name: day_local
        description: Data local da medição no fuso UTC-03:00.
        data_tests:
          - not_null

      - name: expected_panel_readings
        description: Quantidade esperada de medições no dia.
        data_tests:
          - not_null

      - name: valid_panel_readings
        description: Quantidade de medições válidas.
        data_tests:
          - not_null

      - name: missing_or_rejected_readings
        description: Quantidade total de medições ausentes ou rejeitadas.
        data_tests:
          - not_null

      - name: rejected_measurements
        description: Medições rejeitadas ainda sem versão válida correspondente.
        data_tests:
          - not_null

      - name: invalid_measurements
        description: Medições rejeitadas por erros de validação.
        data_tests:
          - not_null

      - name: conflict_measurements
        description: Chaves naturais rejeitadas devido a conflito.
        data_tests:
          - not_null

      - name: gap_measurements
        description: Medições esperadas que não chegaram ao pipeline.
        data_tests:
          - not_null