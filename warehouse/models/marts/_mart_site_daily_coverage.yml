
version: 2

models:
  - name: mart_site_daily_coverage
    description: >
      Cobertura diária das medições válidas por instalação,
      conforme a configuração de painéis e frequência esperada.

    columns:
      - name: site_id
        description: Identificador da instalação.
        data_tests:
          - not_null

      - name: day_local
        description: Data local no fuso UTC-03:00.
        data_tests:
          - not_null

      - name: expected_panel_count
        description: Número de painéis esperados na instalação.
        data_tests:
          - not_null

      - name: expected_slots
        description: Quantidade esperada de horários por dia.
        data_tests:
          - not_null

      - name: expected_panel_readings
        description: Total de medições esperadas no dia.
        data_tests:
          - not_null

      - name: valid_panel_readings
        description: Quantidade de medições válidas recebidas.
        data_tests:
          - not_null

      - name: missing_or_rejected_readings
        description: Diferença entre medições esperadas e válidas.
        data_tests:
          - not_null

      - name: coverage_pct
        description: Percentual de cobertura das medições válidas.
        data_tests:
          - not_null