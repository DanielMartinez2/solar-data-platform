
version: 2

models:
  - name: fct_solar_readings
    description: >
      Tabela de fatos com uma linha por medição
      válida de cada painel solar.

    columns:
      - name: measured_at
        description: Data e hora da medição.
        data_tests:
          - not_null

      - name: site_id
        description: Identificador da instalação.
        data_tests:
          - not_null

      - name: panel_id
        description: Identificador do painel.
        data_tests:
          - not_null

      - name: power_w
        description: Potência instantânea em watts.
        data_tests:
          - not_null

      - name: ingested_at
        description: Data e hora da ingestão no PostgreSQL.
        data_tests:
          - not_null